# nfpm (https://nfpm.goreleaser.com) config for uniqush-push's .deb and .rpm
# packages. The release workflow (.github/workflows/release.yml) sets VERSION
# and ARCH and cds into the staging root (the package's file tree, rooted at /)
# before running `nfpm package -f nfpm.yaml`.
#
# ARCH is fed uname -m's output (e.g. x86_64); nfpm maps that to each
# packager's own architecture name (amd64 for deb, x86_64 for rpm) --
# see https://nfpm.goreleaser.com/docs/arch-mapping/.
name: "uniqush-push"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
version_schema: "none"
section: "net"
maintainer: "Misha Nasledov <misha@nasledov.com>"
description: "Push notification server for APNs, FCM and Web Push, written in Go."
vendor: "uniqush"
homepage: "https://uniqush.org"
# uniqush-push's own code is Apache-2.0. The binary statically links BSD- and
# MIT-licensed modules, so the package as distributed is the combination; see
# THIRD-PARTY-LICENSES, which installs alongside this package.
license: "Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND MIT"

contents:
  - src: ./usr
    dst: /usr
    type: tree
  # Not a tree: the rpm would then own /lib/systemd and /lib/systemd/system,
  # with whatever mode the build's umask gave them.
  - src: ./lib/systemd/system/uniqush-push.service
    dst: /lib/systemd/system/uniqush-push.service
  - dst: /etc/uniqush
    type: dir
  # Not replaced on upgrade, so a token_file or any other setting survives it.
  - src: ./etc/uniqush/uniqush-push.conf
    dst: /etc/uniqush/uniqush-push.conf
    type: config|noreplace

rpm:
  group: "Applications/Internet"
