# nfpm (https://nfpm.goreleaser.com) config for uniqush-push's .deb and .rpm
# packages. build-uniqush-push.sh sets VERSION, ARCH and LICENSE and cds
# into the staging root (the package's file tree, rooted at /) before
# running `nfpm package -f nfpm.yaml`.
#
# ARCH is fed uname -m's output (e.g. x86_64); nfpm maps that to each
# packager's own architecture name (amd64 for deb, x86_64 for rpm) --
# see https://nfpm.goreleaser.com/docs/arch-mapping/.
name: "uniqush-push"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
version_schema: "none"
section: "net"
maintainer: "Misha Nasledov <misha@nasledov.com>"
description: "Push notification server for APNs, FCM and Web Push, written in Go."
vendor: "uniqush"
homepage: "https://uniqush.org"
# uniqush-push's own code is Apache-2.0. The binary statically links BSD- and
# MIT-licensed modules, so the package as distributed is the combination; see
# THIRD-PARTY-LICENSES, which installs alongside this package.
license: "Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND MIT"

contents:
  - src: "."
    dst: /
    type: tree

rpm:
  group: "Applications/Internet"
