logfile=/var/log/uniqush
# Log level: alert, error, warn, info (also standard/verbose), or debug
[WebFrontend]
log=on
loglevel=standard
addr=localhost:9898

[AddPushServiceProvider]
log=on
loglevel=standard

[RemovePushServiceProvider]
log=on
loglevel=standard

[PSPs]
log=on
loglevel=standard

[Subscribe]
log=on
loglevel=standard

[Unsubscribe]
log=on
loglevel=standard

[Push]
log=on
loglevel=standard

[Subscriptions]
log=on
loglevel=standard

[Services]
log=on
loglevel=standard

[Database]
engine=redis
port=0
name=0
everysec=600
leastdirty=10
cachesize=1024

[apns]
# pool_size is gone: it sized the binary protocol's TCP connection pool, and
# HTTP/2 sends a provider's pushes over one multiplexed connection. A pool_size
# left here from an older config is ignored.
#
# allow_non_apple_endpoints=true lets /addpsp accept an endpoint outside
# push.apple.com, for a simulator or a relay. Off by default.
#
# request_timeout is how many seconds one request to APNs has to complete,
# defaulting to 20. Lower it if the client calling /push gives up sooner than
# uniqush does, so a stalled push is reported rather than held; raise it on a
# slow or congested link. Applies per attempt, so a push retried against the
# previous signing token gets the full budget twice. Values outside 1-300 fall
# back to the default.
# request_timeout=20

# FCM, and the same backend registered as gcm. Each name has its own section.
#
# request_timeout is how many seconds one request to FCM has to complete,
# defaulting to 30 -- Google's scaling guide asks for at least 10 before
# retrying. It does not bound the OAuth2 token fetch, which is a different
# operation with a fixed timeout of its own. Values outside 1-300 fall back to
# the default.
[fcm]
# request_timeout=30

[gcm]
# request_timeout=30

# Web Push / UnifiedPush. The same backend is registered under both names, so
# these two sections are independent and each applies to its own name.
#
# Unlike APNs, FCM and ADM, the destination host for a Web Push notification is
# chosen by whoever calls /subscribe rather than being a fixed vendor endpoint.
# uniqush therefore refuses to POST to non-globally-routable addresses by
# default, so that it cannot be used to reach services inside your network.
#
# Relax that only if you run a self-hosted push server on a private network,
# and prefer to pair it with allowed_hosts. Both are read afresh on every
# reconfiguration, so deleting a line closes what it opened.
# record_size sets the RFC 8188 record every message is padded to, and so the
# size of every POST body: a 20-byte wakeup ping and a 3KB notification are both
# exactly this many bytes on the wire. The default, 4096, is what the rest of the
# ecosystem emits and the largest UnifiedPush allows, which puts the payload
# ceiling at 3993 bytes. Halving it to 2048 halves egress, at the cost of clients
# using google/tink's apps-webpush, which rejects any record smaller than the
# 4096 it expects. Values outside 104-4096 fall back to the default.
#
# request_timeout is how many seconds one push has to complete, defaulting to
# 30. It matters more here than for the vendor backends: the endpoint belongs to
# whoever called /subscribe, so it may be a self-hosted server on a slow link
# rather than a CDN. Values outside 1-300 fall back to the default.
[webpush]
# allow_private_addresses=false
# allowed_hosts=push.example.internal, ntfy.example.org
# record_size=4096
# request_timeout=30

[unifiedpush]
# allow_private_addresses=false
# allowed_hosts=push.example.internal
# record_size=4096
# request_timeout=30
