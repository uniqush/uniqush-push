# uniqush-push config for the FCM demo.
#
# For local testing only. It logs verbosely to stderr, which you do not want in
# production but which is the whole point here: the FCM backend logs the
# request it sent and the response Google gave, and that is what you are trying
# to see.

[default]
logfile=

[WebFrontend]
log=on
loglevel=debug
addr=localhost:9898

[AddPushServiceProvider]
log=on
loglevel=debug

[RemovePushServiceProvider]
log=on
loglevel=debug

[PSPs]
log=on
loglevel=debug

[Subscribe]
log=on
loglevel=debug

[Unsubscribe]
log=on
loglevel=debug

[Push]
log=on
loglevel=debug

[Subscriptions]
log=on
loglevel=debug

[Services]
log=on
loglevel=debug

[Database]
engine=redis
host=localhost
port=6379
name=0
everysec=600
leastdirty=10
cachesize=1024
