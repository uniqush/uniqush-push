# uniqush-push config for the Web Push / UnifiedPush demo.
#
# For local testing only. It logs verbosely to stderr and permits pushes to
# private addresses, neither of which you want in production.

[default]
logfile=

[WebFrontend]
log=on
loglevel=debug
addr=localhost:9898

[AddPushServiceProvider]
log=on
loglevel=debug

[RemovePushServiceProvider]
log=on
loglevel=debug

[PSPs]
log=on
loglevel=debug

[Subscribe]
log=on
loglevel=debug

[Unsubscribe]
log=on
loglevel=debug

[Push]
log=on
loglevel=debug

[Subscriptions]
log=on
loglevel=debug

[Services]
log=on
loglevel=debug

[Database]
engine=redis
host=localhost
port=6379
name=0
everysec=600
leastdirty=10
cachesize=1024

# By default uniqush refuses to POST to addresses that are not globally
# routable, because for this backend the destination URL comes from whoever
# called /subscribe rather than from a vendor. That would otherwise make it a
# server-side request forgery primitive.
#
# This is relaxed here so a push server on localhost works for testing. Remove
# it for anything real, or pair it with allowed_hosts.
[unifiedpush]
allow_private_addresses=true
# allowed_hosts=ntfy.sh, push.example.internal

[webpush]
allow_private_addresses=true
